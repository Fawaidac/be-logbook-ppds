openapi: 3.0.3
info:
  title: Logbook PPDS API Specification
  description: API Documentation & Testing Interface for Logbook PPDS Backend (Golang & Gin).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Server

paths:
  /api/v1/auth/login:
    post:
      summary: User Login
      description: Authenticate user using username and password (and optional role).
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: residen01
                password:
                  type: string
                  example: residen01
      responses:
        '200':
          description: Login Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '401':
          description: Invalid Credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      summary: User Logout
      tags:
        - Authentication
      responses:
        '200':
          description: Logout Success

  /api/v1/auth/me:
    get:
      summary: Get Logged-in User Profile
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '401':
          description: Unauthorized

  /api/v1/users:
    get:
      summary: List All Users (Super Admin Only)
      tags:
        - User Management
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of Users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '403':
          description: Forbidden - Insufficient Role

    post:
      summary: Create New User (Super Admin Only)
      tags:
        - User Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - name
                - email
                - password
                - role
              properties:
                username:
                  type: string
                  example: dokter02
                name:
                  type: string
                  example: dr. Ahmad Fauzi
                email:
                  type: string
                  example: ahmad@ppds.id
                password:
                  type: string
                  example: password123
                role:
                  type: string
                  enum: [residen, supervisor, admin, superadmin]
                  example: residen
                jabatan:
                  type: string
                  example: Residen Bedah Th.1
      responses:
        '201':
          description: User Created Successfully

  /api/v1/users/{id}:
    get:
      summary: Get User by ID (Super Admin Only)
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: User Details
        '404':
          description: User Not Found

    put:
      summary: Update User (Super Admin Only)
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - role
              properties:
                name:
                  type: string
                  example: dr. Ahmad Fauzi, Sp.B
                email:
                  type: string
                  example: ahmad.new@ppds.id
                password:
                  type: string
                  example: newpassword123
                role:
                  type: string
                  example: supervisor
                jabatan:
                  type: string
                  example: DPJP Bedah Umum
      responses:
        '200':
          description: User Updated Successfully

    delete:
      summary: Delete User (Super Admin Only)
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 2
      responses:
        '200':
          description: User Deleted Successfully

  /api/v1/jadwals:
    get:
      summary: Get FullCalendar Schedule Events
      description: Get schedule events filtered by start, end date, or type (jaga, bimbingan, rotasi, ujian).
      tags:
        - Jadwal Management
      parameters:
        - in: query
          name: start
          schema:
            type: string
          example: '2026-08-01'
        - in: query
          name: end
          schema:
            type: string
          example: '2026-08-31'
        - in: query
          name: type
          schema:
            type: string
            enum: [all, jaga, bimbingan, rotasi, ujian]
          example: all
      responses:
        '200':
          description: Array of FullCalendar Events

    post:
      summary: Create Schedule Event (Supervisor & Super Admin Only)
      tags:
        - Jadwal Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - start
                - end
                - type
              properties:
                title:
                  type: string
                  example: Jaga Malam IGD Shift 2
                description:
                  type: string
                  example: Menjaga pasien IGD bersama tim 2
                location:
                  type: string
                  example: Ruang IGD RSUD
                start:
                  type: string
                  example: '2026-08-25 20:00:00'
                end:
                  type: string
                  example: '2026-08-26 08:00:00'
                all_day:
                  type: boolean
                  example: false
                type:
                  type: string
                  enum: [jaga, bimbingan, rotasi, ujian]
                  example: jaga
      responses:
        '200':
          description: Event Created Successfully

  /api/v1/jadwals/{id}:
    put:
      summary: Update Schedule Event (Supervisor & Super Admin Only)
      tags:
        - Jadwal Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - start
                - end
                - type
              properties:
                title:
                  type: string
                  example: Jaga Malam IGD Shift 1 Update
                description:
                  type: string
                  example: Deskripsi perbaikan
                location:
                  type: string
                  example: IGD Gedung Utama
                start:
                  type: string
                  example: '2026-08-25 20:00:00'
                end:
                  type: string
                  example: '2026-08-26 08:00:00'
                all_day:
                  type: boolean
                  example: false
                type:
                  type: string
                  example: jaga
      responses:
        '200':
          description: Event Updated Successfully

    delete:
      summary: Delete Schedule Event (Supervisor & Super Admin Only)
      tags:
        - Jadwal Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Event Deleted Successfully

  /api/v1/jadwals/{id}/dates:
    patch:
      summary: Update Schedule Dates for Drag & Drop (Supervisor & Super Admin Only)
      tags:
        - Jadwal Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - start
                - end
              properties:
                start:
                  type: string
                  example: '2026-08-26 20:00:00'
                end:
                  type: string
                  example: '2026-08-27 08:00:00'
                all_day:
                  type: boolean
                  example: false
      responses:
        '200':
          description: Event Dates Updated Successfully

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginSuccessResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Login Success
        data:
          type: object
          properties:
            username:
              type: string
              example: residen01
            name:
              type: string
              example: dr. Ratna Puspita
            role:
              type: string
              example: residen
            jabatan:
              type: string
              example: Residen Bedah Th.2
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6...

    StandardResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Success
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 401
        message:
          type: string
          example: Username, kata sandi, atau peran yang dipilih tidak cocok.
