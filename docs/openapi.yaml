      summary: Approve Aktivitas Klinik
      tags:
        - Approval
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Aktivitas klinik approved successfully

  /api/v1/approval/aktivitas-klinik/{id}/reject:
    post:
      summary: Reject Aktivitas Klinik
      tags:
        - Approval
      security:
        - BearerAuth: []
      parameters:
        - in: path
