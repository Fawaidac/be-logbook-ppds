      tags:
        - Approval
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Kegiatan ilmiah approved successfully

  /api/v1/approval/kegiatan-ilmiah/{id}/reject:
    post:
      summary: Reject Kegiatan Ilmiah
      tags:
        - Approval
      security:
        - BearerAuth: []
      parameters:
        - in: path
