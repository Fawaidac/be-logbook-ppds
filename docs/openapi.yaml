components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from POST /api/v1/auth/login

  schemas:
    LoginSuccessResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Login Success
        data:
          type: object
          properties:
            user:
              type: object
              properties:
                username:
                  type: string
                  example: residen01
                name:
                  type: string
                  example: dr. Ratna Puspita
                role:
                  type: string
                  enum: [residen, supervisor, admin, superadmin]
                  example: residen
                jabatan:
                  type: string
                  example: Residen Bedah Th.2
                program_studi:
                  type: string
                  example: Sp-1 Ilmu Bedah
                nim_nip:
                  type: string
                  example: "190301001"
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    UserProfileResponse:
      type: object
      properties:
        username:
          type: string
          example: residen01
        name:
          type: string
          example: dr. Ratna Puspita
        role:
          type: string
          example: residen
        jabatan:
          type: string
          example: Residen Bedah Th.2
        program_studi:
          type: string
          example: Sp-1 Ilmu Bedah
        nim_nip:
          type: string
          example: "190301001"

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: residen01
        name:
          type: string
          example: dr. Ratna Puspita
        email:
          type: string
          example: ratna@ppds.id
        role:
          type: string
          enum: [residen, supervisor, admin, superadmin]
          example: residen
        nim_nip:
          type: string
          example: "190301001"
        jabatan:
          type: string
          example: Residen Bedah Th.2
        program_studi:
          type: string
          example: Sp-1 Ilmu Bedah
        created_at:
          type: string
          format: date-time
          example: "2026-08-01T07:00:00Z"

    UserRegistrationResponse:
      type: object
      description: Registration submission (before admin approval)
      properties:
        id:
          type: integer
          example: 5
        name:
          type: string
          example: dr. Fajar Ramadhan
        nik:
          type: string
          example: "3509012345678901"
        str:
          type: string
          example: STR/2026/001
        sip:
          type: string
          example: SIP/2026/001
        username:
          type: string
          example: dr.fajar.ramadhan
        email:
          type: string
          example: fajar@ppds.id
        specialty:
          type: string
          example: Ilmu Bedah
        program_studi:
          type: string
          example: Sp-1 Ilmu Bedah
        university:
          type: string
          example: Universitas Jember
        selfie_path:
          type: string
          example: /uploads/selfie_1725776400000000000_foto.jpg
          description: "Relative path served without /api prefix. Access via: http://host/uploads/filename"
        str_file_path:
          type: string
          example: /uploads/str_1725776400000000000_str.pdf
        sip_file_path:
          type: string
          example: /uploads/sip_1725776400000000000_sip.pdf
        status:
          type: string
          enum: [pending, approved, rejected]
          example: pending
        rejection_reason:
          type: string
          example: Dokumen STR tidak valid.
        created_at:
          type: string
          format: date-time
          example: "2026-09-02T08:00:00Z"

    TindakanResponse:
      type: object
      description: A single procedure/action logbook entry
      properties:
        id:
          type: integer
          example: 1
        user_username:
          type: string
          example: dr. Ratna Puspita
        mr_number:
          type: string
          example: RM-88406
        visit_date:
          type: string
          format: date
          example: "2026-08-07"
        patient_name:
          type: string
          example: Tn. Ahmad Hidayat
        gender:
          type: string
          enum: [L, P]
          example: L
        birth_date:
          type: string
          format: date
          example: "1992-05-15"
        division:
          type: string
          example: "Anestesi & ICU"
        diagnosis_label:
          type: string
          example: Fraktur Femur Dekstra
        procedure_code:
          type: string
          example: ORIF-PLT-01
