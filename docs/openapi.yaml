  /api/v1/approval/pendidikan-evaluasi/{id}/approve:
    post:
      summary: Approve Pendidikan Evaluasi
      tags:
        - Approval
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pendidikan evaluasi approved successfully

  /api/v1/approval/pendidikan-evaluasi/{id}/reject:
    post:
      summary: Reject Pendidikan Evaluasi
      tags:
        - Approval
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pendidikan evaluasi marked for revision

  /api/v1/dashboard:
    get:
      summary: Get Dashboard Overview & Metrics
      description: Retrieve total actions count, pending validation count, revision count, upcoming schedules, recent logbook entries, and monthly cumulative chart data.
      tags:
        - Dashboard
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: year
          required: false
          schema:
            type: integer
          example: 2026
        - in: query
          name: username
          required: false
          schema:
            type: string
          example: residen01
      responses:
        "200":
          description: Dashboard summary retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Berhasil mengambil data dashboard
                  data:
                    $ref: "#/components/schemas/DashboardSummaryResponse"
        "401":
          description: Unauthorized

  /api/v1/dashboard/residen:
    get:
      summary: Get Resident Dashboard (personal)
      description: Retrieve dashboard summary specifically scoped to the logged-in resident. Data is always filtered by the caller's username regardless of role.
      tags:
        - Dashboard
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: year
          required: false
          schema:
            type: integer
          example: 2026
      responses:
        "200":
          description: Resident dashboard summary retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Berhasil mengambil data dashboard residen
                  data:
                    $ref: "#/components/schemas/DashboardSummaryResponse"
        "401":
          description: Unauthorized

  /api/v1/dashboard/admin:
    get:
      summary: Get Admin Dashboard
      description: Retrieve aggregate counts (residen, supervisor, admin, pending registrations, total tindakan), activation percentage, pending registration list, system activity breakdown per module, and role distribution for charts. Admin only.
      tags:
        - Dashboard
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Admin dashboard aggregated data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Berhasil mengambil data dashboard admin
                  data:
                    $ref: "#/components/schemas/AdminDashboardResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - admin role required

  /api/v1/dashboard/supervisor:
    get:
      summary: Get Supervisor Dashboard
      description: Retrieve logbook validation statistics (menunggu, disetujui bulan ini dengan pertumbuhan vs bulan lalu, perlu revisi), total residen, 6-month validation chart, most active residen list, and latest pending approval queue. Supervisor only.
      tags:
        - Dashboard
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Supervisor dashboard aggregated data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Berhasil mengambil data dashboard supervisor
                  data:
                    $ref: "#/components/schemas/SupervisorDashboardResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - supervisor role required

  /api/v1/dashboard/laporan:
    get:
      summary: Get Report Summary & Statistics
      description: Retrieve rekap logbook per procedure, kompetensi list, kegiatan ilmiah counts, supervision response rate, and DPJP statistics.
      tags:
        - Dashboard
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: periode
          required: false
          schema:
            type: string
            enum: [bulan_ini, tahun_ini, semua]
          example: bulan_ini
        - in: query
          name: stase
          required: false
          schema:
            type: string
          example: semua
        - in: query
          name: username
          required: false
          schema:
            type: string
          example: residen01
      responses:
        "200":
          description: Report summary retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Berhasil mengambil data laporan
                  data:
                    $ref: "#/components/schemas/LaporanSummaryResponse"
        "401":
          description: Unauthorized

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginSuccessResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Login Success
        data:
          type: object
          properties:
            username:
              type: string
              example: residen01
            name:
              type: string
              example: dr. Ratna Puspita
            role:
              type: string
              example: residen
            jabatan:
              type: string
              example: Residen Bedah Th.2
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6...

    StandardResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Success
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 401
        message:
          type: string
          example: Username, kata sandi, atau peran yang dipilih tidak cocok.
    DashboardSummaryResponse:
      type: object
      properties:
        total_tindakan:
          type: integer
          example: 24
        menunggu_validasi:
          type: integer
          example: 3
        perlu_revisi:
          type: integer
          example: 1
        capaian_stase:
          type: integer
          example: 76
        upcoming_jadwals:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              title:
                type: string
                example: Jaga Malam IGD Shift 2
              start:
                type: string
                example: "2026-08-25T20:00:00Z"
              end:
                type: string
                example: "2026-08-26T08:00:00Z"
              all_day:
                type: boolean
                example: false
              type:
                type: string
                example: jaga
              location:
                type: string
                example: Ruang IGD RSUD
        recent_entries:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              procedure_date:
                type: string
                example: "2026-08-20T00:00:00Z"
              diagnosis_label:
                type: string
                example: Fraktur Femur Dekstra
              plan_procedure:
                type: string
                example: ORIF Plating Femur
              kemandirian:
                type: string
                example: mandiri
              supervisor_name:
                type: string
                example: dr. Andi Wijaya, Sp.OT
              dpjp_name:
                type: string
                example: dr. Andi Wijaya, Sp.OT
              status:
                type: string
                example: disetujui
        chart_data:
          type: object
          properties:
            months:
              type: array
              items:
                type: string
              example: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]
            mandiri:
              type: array
              items:
                type: integer
              example: [1, 3, 5, 8, 12, 15, 18, 20, 22, 24, 24, 24]
            dibimbing:
              type: array
              items:
                type: integer
              example: [0, 1, 2, 4, 5, 7, 9, 10, 11, 12, 12, 12]
            observasi:
              type: array
              items:
                type: integer
              example: [0, 0, 1, 1, 2, 3, 3, 4, 4, 5, 5, 5]
            seminar:
              type: array
              items:
                type: integer
              example: [1, 1, 2, 2, 3, 4, 4, 5, 5, 6, 6, 6]

    AdminDashboardResponse:
      type: object
      properties:
        total_residen:
          type: integer
          example: 23
        total_supervisor:
          type: integer
          example: 9
        total_admin:
          type: integer
          example: 3
        total_registrasi:
          type: integer
          example: 5
        total_tindakan:
          type: integer
          example: 12480
