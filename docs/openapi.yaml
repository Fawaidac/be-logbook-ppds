components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginSuccessResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Login Success
        data:
          type: object
          properties:
            username:
              type: string
              example: residen01
            name:
              type: string
              example: dr. Ratna Puspita
            role:
              type: string
              example: residen
            jabatan:
              type: string
              example: Residen Bedah Th.2
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6...

    StandardResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Success
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 401
        message:
          type: string
          example: Username, kata sandi, atau peran yang dipilih tidak cocok.
