openapi: 3.0.3
info:
  title: Logbook PPDS API Specification
  description: |
    API Documentation & Testing Interface for Logbook PPDS Backend (Golang & Gin).

    ## Authentication
    Most endpoints require a Bearer JWT token obtained from `POST /api/v1/auth/login`.

    ## Role-Based Access
    | Role | Access Level |
    |------|-------------|
    | `residen` | Own data only |
    | `supervisor` | Own supervisee data, approval |
    | `admin` | All data, user management, registrations |
    | `superadmin` | Full access |

    ## File Uploads
    Uploaded files (selfie, STR, SIP) are served at `/uploads/<filename>` (no `/api` prefix).
  version: 2.0.0
servers:
  - url: http://localhost:8080
    description: Local Development Server

tags:
  - name: Authentication
    description: Login, logout, register, and profile endpoints
  - name: User Management
    description: CRUD for user accounts and registration approvals (Admin only)
  - name: Jadwal Management
    description: FullCalendar schedule events
  - name: Tindakan Logbook
    description: Procedure/action logbook entries with role-based filtering
  - name: Kegiatan Ilmiah
    description: Scientific activities and research supervision
  - name: Bimbingan Penelitian
    description: Research mentoring sessions
  - name: Pendidikan
    description: Educational evaluations (Kompetensi, Rotasi, Mini-CEX, DOPS, Seminar, CBD)
  - name: Approval
    description: Approval workflow for tindakan, kegiatan ilmiah, and pendidikan evaluasi
  - name: Dashboard
    description: Aggregated metrics and analytics per role

paths:
  /api/v1/auth/login:
    post:
      summary: User Login
      description: Authenticate using username and password. Returns JWT token and user profile.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: residen01
                password:
                  type: string
                  example: password123
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccessResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/register:
    post:
      summary: Register New PPDS Applicant
      description: |
        Submit a PPDS registration request. Accepts `multipart/form-data` with optional file uploads (selfie, STR, SIP).
        Files are stored at `/uploads/<unique_filename>` — served without `/api` prefix.
        The registration is reviewed by an admin before a user account is created.
        The `username` and `password` provided here will be used when the account is activated.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - username
                - email
                - password
                - password_confirmation
              properties:
                name:
                  type: string
                  example: "dr. Fajar Ramadhan"
                  description: Full name of the applicant
                username:
                  type: string
                  example: dr.fajar.ramadhan
                  description: Desired login username (must be unique)
                nik:
                  type: string
                  example: "3509012345678901"
                str:
                  type: string
                  example: STR/2026/001
                sip:
                  type: string
                  example: SIP/2026/001
                email:
                  type: string
                  format: email
                  example: fajar@ppds.id
                password:
                  type: string
                  format: password
                  example: secret123
                password_confirmation:
                  type: string
                  format: password
                  example: secret123
                  description: Must match `password`
                specialty:
                  type: string
                  example: Ilmu Bedah
                program_studi:
                  type: string
                  example: Sp-1 Ilmu Bedah
                university:
                  type: string
                  example: Universitas Jember
                selfie:
                  type: string
                  format: binary
                  description: Selfie photo (image file)
                str_file:
                  type: string
                  format: binary
                  description: STR document file
                sip_file:
                  type: string
                  format: binary
                  description: SIP document file
      responses:
        "201":
          description: Registration submitted - awaiting admin review
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: "Pendaftaran PPDS berhasil dikirim. Menunggu verifikasi admin."
                  data:
                    $ref: "#/components/schemas/UserRegistrationResponse"
        "400":
          description: Validation error (missing required fields, password mismatch, duplicate email/username)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/logout:
    post:
      summary: User Logout
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logout successful

  /api/v1/auth/me:
    get:
      summary: Get Logged-in User Profile
      description: Returns the profile of the currently authenticated user from the JWT token.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Berhasil mengambil data profil
                  data:
                    $ref: "#/components/schemas/UserProfileResponse"
        "401":
          description: Unauthorized

  /api/v1/users:
    get:
      summary: List All Users
      description: Returns all user accounts. Requires admin role.
      tags:
        - User Management
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Berhasil mengambil daftar pengguna
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserResponse"
        "403":
          description: Forbidden - admin role required
    post:
      summary: Create New User
      description: Directly creates an activated user account. Requires admin role.
      tags:
        - User Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - name
                - email
                - password
                - role
              properties:
                username:
                  type: string
                  example: dokter02
                name:
                  type: string
                  example: "dr. Ahmad Fauzi"
                email:
                  type: string
                  example: ahmad@ppds.id
                password:
                  type: string
                  example: password123
                role:
                  type: string
                  enum: [residen, supervisor, admin, superadmin]
                  example: residen
                nim_nip:
                  type: string
                  example: "190301001"
                jabatan:
                  type: string
                  example: Residen Bedah Th.1
                program_studi:
                  type: string
                  example: Sp-1 Ilmu Bedah
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Pengguna berhasil dibuat
                  data:
                    $ref: "#/components/schemas/UserResponse"

  /api/v1/users/registrations:
    get:
      summary: List Registration Requests
      description: Get all PPDS registration submissions, optionally filtered by status. Requires admin role.
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
          example: pending
          description: Filter by registration status
      responses:
        "200":
          description: List of registration requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Berhasil mengambil daftar permintaan registrasi
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserRegistrationResponse"
        "403":
          description: Forbidden - admin role required

  /api/v1/users/registrations/{id}/approve:
    post:
      summary: Approve Registration Request
      description: |
        Approves a pending PPDS registration. Creates an activated user account using the
        username and password provided by the applicant. An approval email is sent automatically.
        Requires admin role.
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 3
      responses:
        "200":
          description: Registration approved and user account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Permintaan registrasi berhasil disetujui. Akun residen telah dibuat."
                  data:
                    $ref: "#/components/schemas/UserResponse"
        "400":
          description: Registration not found or already processed
        "403":
          description: Forbidden - admin role required

  /api/v1/users/registrations/{id}/reject:
    post:
      summary: Reject Registration Request
      description: Rejects a pending PPDS registration and sends a rejection email. Requires admin role.
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 3
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: Dokumen STR tidak lengkap atau tidak valid.
          multipart/form-data:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: Dokumen STR tidak lengkap atau tidak valid.
      responses:
        "200":
          description: Registration rejected and notification email sent
        "400":
          description: Registration not found or already processed
        "403":
          description: Forbidden - admin role required

  /api/v1/users/{id}:
    get:
      summary: Get User by ID
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/UserResponse"
        "404":
          description: User not found
    put:
      summary: Update User
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - role
              properties:
                name:
                  type: string
                  example: "dr. Ahmad Fauzi, Sp.B"
                email:
                  type: string
                  example: ahmad.new@ppds.id
                password:
                  type: string
                  example: newpassword123
                  description: Leave blank to keep existing password
                role:
                  type: string
                  enum: [residen, supervisor, admin, superadmin]
                  example: supervisor
                nim_nip:
                  type: string
                  example: "190301001"
                jabatan:
                  type: string
                  example: DPJP Bedah Umum
                program_studi:
                  type: string
                  example: Sp-1 Ilmu Bedah
      responses:
        "200":
          description: User updated successfully
    delete:
      summary: Delete User
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 2
      responses:
        "200":
          description: User deleted successfully

  /api/v1/jadwals:
    get:
      summary: Get Schedule Events (FullCalendar)
      description: Returns events in FullCalendar-compatible format. Filterable by date range and type.
      tags:
        - Jadwal Management
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: start
          schema:
            type: string
            format: date
          example: "2026-08-01"
        - in: query
          name: end
          schema:
            type: string
            format: date
          example: "2026-08-31"
        - in: query
          name: type
          schema:
            type: string
            enum: [all, jaga, bimbingan, rotasi, ujian]
          example: all
      responses:
        "200":
          description: Array of FullCalendar event objects
    post:
      summary: Create Schedule Event
      tags:
        - Jadwal Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - start
                - end
                - type
              properties:
                title:
                  type: string
                  example: Jaga Malam IGD Shift 2
                description:
                  type: string
                  example: Menjaga pasien IGD bersama tim 2
                location:
                  type: string
                  example: Ruang IGD RSUD
                start:
                  type: string
                  example: "2026-08-25 20:00:00"
                end:
                  type: string
                  example: "2026-08-26 08:00:00"
                all_day:
                  type: boolean
                  example: false
                type:
                  type: string
                  enum: [jaga, bimbingan, rotasi, ujian]
                  example: jaga
      responses:
        "200":
          description: Event created successfully

  /api/v1/jadwals/{id}:
    put:
      summary: Update Schedule Event
      tags:
        - Jadwal Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: Jaga Malam IGD Shift 1 Update
                description:
                  type: string
                location:
                  type: string
                  example: IGD Gedung Utama
                start:
                  type: string
                  example: "2026-08-25 20:00:00"
                end:
                  type: string
                  example: "2026-08-26 08:00:00"
                all_day:
                  type: boolean
                  example: false
                type:
                  type: string
                  example: jaga
      responses:
        "200":
          description: Event updated successfully
    delete:
      summary: Delete Schedule Event
      tags:
        - Jadwal Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Event deleted successfully

  /api/v1/jadwals/{id}/dates:
    patch:
      summary: Update Schedule Dates (Drag & Drop)
      description: Updates only the start/end of an event. Used for FullCalendar drag-and-drop.
      tags:
        - Jadwal Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - start
                - end
              properties:
                start:
                  type: string
                  example: "2026-08-26 20:00:00"
                end:
                  type: string
                  example: "2026-08-27 08:00:00"
                all_day:
                  type: boolean
                  example: false
      responses:
        "200":
          description: Event dates updated successfully

  /api/v1/tindakans:
    get:
      summary: Get Logbook Summary & Tindakan Entries
      description: |
        Returns rekap statistics (total_count, mandiri_count, dibimbing_count, observasi_count,
        disetujui_count, verifikasi_percent) plus all procedure entries. Data is **role-scoped**:
        - **residen**: only own entries
        - **supervisor**: entries where `supervisor_name` matches logged-in name; `department` acts as division filter
        - **admin / superadmin**: all entries; `department` filters by division
      tags:
        - Tindakan Logbook
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: department
          required: false
          schema:
            type: string
          description: |
            Filter by department/division (case-insensitive, partial match).
            Used by admin to scope data to a specific department.
          example: "Anestesi & ICU"
      responses:
        "200":
          description: Logbook summary and entry list
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Berhasil mengambil rekap logbook tindakan
                  data:
                    $ref: "#/components/schemas/TindakanSummaryResponse"
        "401":
          description: Unauthorized
    post:
      summary: Create New Tindakan (Draft)
      description: Creates a new procedure entry with status `draft`. Call `POST /{id}/send` to submit for approval.
      tags:
        - Tindakan Logbook
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mr_number
                - patient_name
                - diagnosis_label
                - plan_procedure
              properties:
                mr_number:
                  type: string
                  example: RM-88406
                visit_date:
                  type: string
                  format: date
                  example: "2026-08-07"
                patient_name:
                  type: string
                  example: Tn. Ahmad Hidayat
                gender:
                  type: string
                  enum: [L, P]
                  example: L
                birth_date:
                  type: string
                  format: date
                  example: "1992-05-15"
                division:
                  type: string
                  example: "Anestesi & ICU"
                diagnosis_label:
                  type: string
                  example: Fraktur Femur Dekstra
                procedure_code:
                  type: string
                  example: ORIF-PLT-01
                plan_procedure:
                  type: string
                  example: ORIF Plating Femur
                activity:
                  type: string
                  example: Bedah Sentral (OK)
                procedure_date:
                  type: string
                  format: date
                  example: "2026-08-07"
                room_label:
                  type: string
                  example: OK 2 Central
                role_label:
                  type: string
                  example: Operator Utama
                kemandirian:
                  type: string
                  enum: [mandiri, dibimbing, observasi]
                  example: mandiri
                clinical_note:
                  type: string
                  example: Reduksi anatomis sukses
                supervisor_name:
                  type: string
                  example: "dr. Andi Wijaya, Sp.OT"
      responses:
        "201":
          description: Tindakan draft created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Tindakan berhasil disimpan. Silakan klik 'Kirim' untuk mengirim ke approval DPJP."
                  tindakan:
                    $ref: "#/components/schemas/TindakanResponse"

  /api/v1/tindakans/getdpjp:
    get:
      summary: Get DPJP (Supervisor) List
      description: |
        Returns names of all users with `role = supervisor`. Optionally filtered by `program_studi`.
        Used to populate DPJP dropdown when creating a tindakan.
      tags:
        - Tindakan Logbook
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: program_studi
          required: false
          schema:
            type: string
          description: Filter supervisors by program studi. Leave empty for all.
          example: Ilmu Kesehatan Mata
      responses:
        "200":
          description: List of DPJP names
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Berhasil mengambil daftar DPJP
                  data:
                    type: array
                    items:
                      type: string
                    example:
                      - "dr. Andi Wijaya, Sp.OT"
                      - "dr. Siti Rahma, Sp.OT"
        "401":
          description: Unauthorized

  /api/v1/tindakans/by-department:
    get:
      summary: Get Tindakan by Department
      description: |
        Returns all tindakan entries for a given department. Uses case-insensitive partial-match SQL
        (e.g., `Anestesi` matches `Anestesi & ICU`). Intended for admin role.
      tags:
        - Tindakan Logbook
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: department
          required: true
          schema:
            type: string
          description: Department/division name (case-insensitive, partial match)
          example: "Anestesi & ICU"
      responses:
        "200":
          description: List of tindakan for the department
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Berhasil mengambil data tindakan per departemen
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TindakanResponse"
        "400":
          description: Missing required `department` parameter
        "401":
          description: Unauthorized

  /api/v1/tindakans/by-supervisor/{name}:
    get:
      summary: Get Tindakan by Supervisor
      description: |
        Returns all tindakan entries where `supervisor_name` matches the given name.
        Uses case-insensitive partial-match SQL. The `:name` path segment should be URL-encoded
        (spaces as `%20` or `+`). Optionally filtered by `division`.
      tags:
        - Tindakan Logbook
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: "Supervisor name URL-encoded. E.g: dr.+Budi+Santoso,+Sp.B"
          example: "dr.+Budi+Santoso,+Sp.B"
        - in: query
          name: division
          required: false
          schema:
            type: string
          description: Optional division/department filter (case-insensitive, partial match)
          example: "Anestesi & ICU"
      responses:
        "200":
          description: List of tindakan for the supervisor
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Berhasil mengambil data tindakan per supervisor
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TindakanResponse"
        "400":
          description: Missing supervisor name parameter
        "401":
          description: Unauthorized

  /api/v1/tindakans/{id}:
    get:
      summary: Get Single Tindakan Detail
      tags:
        - Tindakan Logbook
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Tindakan detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Berhasil mengambil detail tindakan
                  data:
                    $ref: "#/components/schemas/TindakanResponse"
        "404":
          description: Tindakan not found
    put:
      summary: Update Tindakan
      tags:
        - Tindakan Logbook
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mr_number
                - patient_name
                - plan_procedure
              properties:
                mr_number:
                  type: string
                  example: RM-88406
                patient_name:
                  type: string
                  example: Tn. Ahmad Hidayat
                plan_procedure:
                  type: string
                  example: ORIF Plating Femur Update
                diagnosis_label:
                  type: string
                  example: Fraktur Femur Update
                room_label:
                  type: string
                  example: OK 1
                clinical_note:
                  type: string
                  example: Catatan perbaikan
      responses:
        "200":
          description: Tindakan updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Tindakan berhasil diperbarui.
                  tindakan:
                    $ref: "#/components/schemas/TindakanResponse"
    delete:
      summary: Delete Tindakan
      tags:
